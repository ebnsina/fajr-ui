allowBuilds:
  # Its postinstall only prints a thank-you message and a link — nothing the
  # package needs in order to work. Left undecided, pnpm refuses to install at
  # all on a clean checkout, which is what broke the first CI run.
  '@hugeicons/svelte': false
  esbuild: true
minimumReleaseAgeExclude:
  - '@tanstack/charts@0.7.2'
  - '@tanstack/svelte-charts@0.7.2'
  - '@tanstack/charts-scales@0.7.2'
