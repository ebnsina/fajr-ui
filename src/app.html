<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
		<script>
			// Applied before first paint so the theme never flashes.
			try {
				const stored = localStorage.getItem('fajr-ui-mode');
				const dark =
					stored === 'dark' ||
					((!stored || stored === 'system') &&
						window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', dark);

				// Black is the default and sets no attribute, so an unset value is
				// already correct — naming a colour here would flash it on first paint
				// for everyone who never chose one.
				const accent = localStorage.getItem('fajr-ui-accent');
				if (accent && accent !== 'black') {
					document.documentElement.setAttribute('data-accent', accent);
				}
			} catch {}
		</script>
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="bg-background font-sans text-foreground antialiased"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
