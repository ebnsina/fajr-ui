name: Publish CLI

# Tagged releases only, plus a manual button for a re-run. The tag is what
# names the release; `cli-` prefixes it because the CLI's version is its own
# and does not track the site's.
on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:

permissions:
  contents: read
  # Lets the job mint the OIDC token npm exchanges for publish rights. Without
  # it there is no credential at all — this is the whole mechanism.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    # Read once at the job level so the step below can branch on whether it is
    # set. A secret referenced only inside a step is not visible to that step's
    # own `if`, which is the trap this avoids.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Deliberately uncached: a release should resolve dependencies from
          # the lockfile, not from whatever a previous run happened to leave.
          cache: ''

      # setup-node pins an npm that may predate trusted publishing. Publishing
      # would then fall back to looking for a token, find none, and fail with an
      # authentication error that says nothing about the real cause.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # The published tarball is the artefact, so the test that checks what npm
      # was told to ship matters more here than anywhere else.
      - run: npx vitest run --project cli

      # A tag that disagrees with the manifest publishes a version nobody asked
      # for, under a name that now means something else. Cheaper to stop here.
      - name: Check the tag matches the manifest
        if: github.event_name == 'push'
        run: |
          tagged="${GITHUB_REF_NAME#cli-v}"
          declared=$(node -p "require('./cli/package.json').version")
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag cli-v$tagged does not match cli/package.json version $declared"
            exit 1
          fi
          echo "publishing $declared"

      # Trusted publishing cannot create a package that does not exist yet, so
      # the very first release is authenticated with a short-lived token
      # instead. Once the package exists and a trusted publisher is registered,
      # delete the NPM_TOKEN secret: this step then writes nothing, npm finds no
      # credential, and falls through to OIDC on its own.
      #
      # The line is written only when the token is non-empty on purpose. An
      # empty `_authToken` in .npmrc is worse than none — npm sends it, the
      # registry rejects it, and OIDC is never attempted.
      - name: Authenticate for the bootstrap publish
        if: env.NPM_TOKEN != ''
        run: |
          echo "::warning::Publishing with a stored token. Register a trusted publisher and delete the NPM_TOKEN secret."
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc

      - run: npm publish
        working-directory: cli
